name: Snake Contribution

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    paths:
      - '.github/workflows/snake.yml'

permissions:
  contents: read

concurrency:
  group: snake-contribution
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Gerar Snake em azul e preto
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#58A6FF&color_dots=#161B22,#0D2746,#164B7A,#1F6FEB,#79C0FF

      - name: Publicar SVG na branch output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          commit_message: 'chore(profile): atualiza snake de contribuicoes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
